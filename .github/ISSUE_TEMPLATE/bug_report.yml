name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerability?** Do not file it here: use the private report link instead.
        **Never paste real client data, account IDs, ExternalIds, keys or tokens.**
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: With the built-in sample data (`dev.ps1 demo -save ...`) if possible.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Dashboard, API, Scan (AWS), Scan (Azure), Reports (PDF/CSV/JSON), Deployment, Other]
