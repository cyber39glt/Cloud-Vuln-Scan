# Rule -> framework control references (ADR 0008).
#
# Licensing: NIST CSF is public domain, so official titles are used. CIS Benchmarks
# and the AICPA Trust Services Criteria are copyrighted: only control IDs and our own
# short paraphrased titles are stored here, never their text.
#
# verified = false means nobody has yet checked the reference against the official
# document for the version listed. CIS section numbers change between versions.
# SOC 2 references are interpretive ("relevant to"), never a compliance claim.

[frameworks.cis_aws]
name = "CIS Amazon Web Services Foundations Benchmark"
version = "3.0.0"
providers = ["aws"]

[frameworks.cis_azure]
name = "CIS Microsoft Azure Foundations Benchmark"
version = "2.1.0"
providers = ["azure"]

[frameworks.nist_csf]
name = "NIST Cybersecurity Framework"
version = "2.0"
providers = ["aws", "azure"]

[frameworks.soc2]
name = "AICPA Trust Services Criteria (SOC 2)"
version = "2017 (revised points of focus 2022)"
providers = ["aws", "azure"]

# ------------------------------------------------------------------ NET-001
[[mapping]]
rule = "NET-001"
framework = "cis_aws"
control = "5.2"
title = "Security groups do not allow internet ingress to remote administration ports (IPv4)"
verified = false

[[mapping]]
rule = "NET-001"
framework = "cis_aws"
control = "5.3"
title = "Security groups do not allow internet ingress to remote administration ports (IPv6)"
verified = false

[[mapping]]
rule = "NET-001"
framework = "cis_azure"
control = "6.1"
title = "RDP access from the internet is evaluated and restricted"
verified = false

[[mapping]]
rule = "NET-001"
framework = "cis_azure"
control = "6.2"
title = "SSH access from the internet is evaluated and restricted"
verified = false

[[mapping]]
rule = "NET-001"
framework = "nist_csf"
control = "PR.IR-01"
title = "Networks and environments are protected from unauthorized logical access and usage"
verified = true

[[mapping]]
rule = "NET-001"
framework = "soc2"
control = "CC6.6"
title = "Logical access security measures against threats from outside system boundaries"
verified = false

# ------------------------------------------------------------------ AWS-LOG-001
[[mapping]]
rule = "AWS-LOG-001"
framework = "cis_aws"
control = "3.1"
title = "CloudTrail is enabled in all regions"
verified = false

[[mapping]]
rule = "AWS-LOG-001"
framework = "nist_csf"
control = "PR.PS-04"
title = "Log records are generated and made available for continuous monitoring"
verified = true

[[mapping]]
rule = "AWS-LOG-001"
framework = "nist_csf"
control = "DE.CM-03"
title = "Personnel activity and technology usage are monitored to find potentially adverse events"
verified = true

[[mapping]]
rule = "AWS-LOG-001"
framework = "soc2"
control = "CC7.2"
title = "System components are monitored for anomalies indicative of malicious acts"
verified = false

# ------------------------------------------------------------------ AZ-STO-001
[[mapping]]
rule = "AZ-STO-001"
framework = "cis_azure"
control = "3.7"
title = "Anonymous blob access is disabled for storage accounts"
verified = false

[[mapping]]
rule = "AZ-STO-001"
framework = "nist_csf"
control = "PR.DS-01"
title = "The confidentiality, integrity, and availability of data-at-rest are protected"
verified = true

[[mapping]]
rule = "AZ-STO-001"
framework = "nist_csf"
control = "PR.AA-05"
title = "Access permissions, entitlements, and authorizations are defined in a policy, managed, enforced, and reviewed"
verified = true

[[mapping]]
rule = "AZ-STO-001"
framework = "soc2"
control = "CC6.1"
title = "Logical access security over protected information assets"
verified = false
