# Local development environment: PostgreSQL + the API + the scan worker + the
# dashboard (Vite dev server with hot reload, at http://localhost:5173).
# Use scripts/dev.ps1 rather than calling docker compose directly.
#
# Values like ${POSTGRES_USER} are read from the .env file next to this file.

name: cloud-vuln-scan

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Named volume: data survives `down`/`up`. Removed only by `dev.ps1 reset`.
      - pgdata:/var/lib/postgresql/data
    # No `ports:` section on purpose. The database is reachable only by other
    # containers on this project's private network, not from your machine or LAN.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      # Inside the compose network, the database is reached by its service name.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Windows bind mounts do not deliver file-change events to Linux
      # containers, so the auto-reloader polls for changes instead.
      WATCHFILES_FORCE_POLLING: "true"
      # Tool caches go to /tmp: the container user cannot write elsewhere.
      RUFF_CACHE_DIR: /tmp/ruff-cache
      UV_CACHE_DIR: /tmp/uv-cache
    volumes:
      # Mount the source code so edits on your machine apply without rebuilding.
      - ./backend:/app
      # Client onboarding templates, read-only (tests check them against settings).
      - ./infra:/infra:ro
    ports:
      # 127.0.0.1 = only reachable from this computer, not from your network.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Liveness only: the API is "up" even if the database is briefly down.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    # Same image and code as the API, different command: it runs queued scans.
    build:
      context: ./backend
      target: dev
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - ./backend:/app
    # No ports: the worker only talks to the database and (read-only) to cloud APIs.
    depends_on:
      db:
        condition: service_healthy
    # Docker sends SIGTERM on stop; give a running scan time to finish first.
    stop_grace_period: 2m
    healthcheck:
      # Healthy while the worker loop keeps touching its marker file.
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-alive') > 120)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

  web:
    # The dashboard in development: edits in frontend/ show up instantly. API calls
    # are forwarded to the api container. (In production the API serves the built
    # dashboard itself; see backend/Dockerfile.)
    image: node:24-alpine
    working_dir: /web
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev"]
    environment:
      API_PROXY_TARGET: http://api:8000
      VITE_POLLING: "true"
    volumes:
      - ./frontend:/web
      # node_modules stays inside Docker (faster, and Windows-safe).
      - web_node_modules:/web/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  pgdata:
  web_node_modules:
