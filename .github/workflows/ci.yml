# Continuous Integration: runs on every push and pull request.
# It uses the same Docker setup as local development, so "passes on my machine"
# and "passes in CI" mean the same thing.
name: CI

on:
  push:
  pull_request:

# Least privilege for the workflow token: read the code, nothing else.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Build images and start PostgreSQL + API + worker
        run: docker compose up --build --detach --wait

      - name: Apply database migrations to a fresh database
        run: docker compose run --rm api alembic upgrade head

      - name: Database models match the migrations (no forgotten migration)
        run: docker compose run --rm api alembic check

      - name: Ruff lint
        run: docker compose run --rm --no-deps api ruff check --output-format=github .

      - name: Ruff format check
        run: docker compose run --rm --no-deps api ruff format --check .

      - name: Tests (including database integration)
        run: docker compose run --rm api pytest

      - name: Smoke test the running API
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready

      - name: Smoke test API -> queue -> worker
        # CI has no cloud credentials, so the queued scan must FAIL with a clear
        # reason. That proves the worker picked it up and recorded the outcome.
        run: |
          api=http://127.0.0.1:8000/api/v1
          post() { curl --fail --silent --show-error -H 'content-type: application/json' -d "$2" "$api/$1"; }
          field() { python3 -c "import json,sys; print(json.load(sys.stdin)$1)"; }
          client=$(post clients '{"name":"CI smoke"}' | field '["id"]')
          conn=$(post "clients/$client/connections/aws" '{"account_id":"111122223333"}' | field '["connection"]["id"]')
          assessment=$(post "clients/$client/assessments" "{\"connection_id\":\"$conn\",\"name\":\"smoke\"}" | field '["id"]')
          job=$(post "clients/$client/assessments/$assessment/scans" '{}' | field '["id"]')
          for _ in $(seq 1 30); do
            status=$(curl --fail --silent "$api/clients/$client/scan-jobs/$job" | field '["status"]')
            [ "$status" = failed ] && break
            sleep 2
          done
          curl --silent "$api/clients/$client/scan-jobs/$job"; echo
          test "$status" = failed

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down --volumes

  production-image:
    name: Build production image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the prod target
        run: docker build --target prod --tag cloud-vuln-scan-api:ci ./backend
      - name: Production image must run as a non-root user
        run: test "$(docker run --rm --entrypoint id cloud-vuln-scan-api:ci -un)" = "app"

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: a secret deleted later is still leaked
      - name: Gitleaks
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo"
          zricethezav/gitleaks:v8.30.1
          git /repo --redact --no-banner --verbose
