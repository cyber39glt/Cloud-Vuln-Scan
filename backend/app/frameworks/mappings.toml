# Rule -> framework control references (ADR 0008).
#
# Licensing: NIST CSF is public domain, so official titles are used. CIS Benchmarks
# and the AICPA Trust Services Criteria are copyrighted: only control IDs and our own
# short paraphrased titles are stored here, never their text.
#
# verified = false means nobody has yet checked the reference against the official
# document for the version listed. CIS section numbers change between versions.
# SOC 2 references are interpretive ("relevant to"), never a compliance claim.

[frameworks.cis_aws]
name = "CIS Amazon Web Services Foundations Benchmark"
version = "3.0.0"
providers = ["aws"]

[frameworks.cis_azure]
name = "CIS Microsoft Azure Foundations Benchmark"
version = "2.1.0"
providers = ["azure"]

[frameworks.nist_csf]
name = "NIST Cybersecurity Framework"
version = "2.0"
providers = ["aws", "azure"]

[frameworks.soc2]
name = "AICPA Trust Services Criteria (SOC 2)"
version = "2017 (revised points of focus 2022)"
providers = ["aws", "azure"]

# ------------------------------------------------------------------ NET-001 (SSH)
[[mapping]]
rule = "NET-001"
framework = "cis_aws"
control = "5.2"
title = "Security groups do not allow internet ingress to remote administration ports (IPv4)"
verified = false

[[mapping]]
rule = "NET-001"
framework = "cis_aws"
control = "5.3"
title = "Security groups do not allow internet ingress to remote administration ports (IPv6)"
verified = false

[[mapping]]
rule = "NET-001"
framework = "cis_azure"
control = "6.2"
title = "SSH access from the internet is evaluated and restricted"
verified = false

[[mapping]]
rule = "NET-001"
framework = "nist_csf"
control = "PR.IR-01"
title = "Networks and environments are protected from unauthorized logical access and usage"
verified = true

[[mapping]]
rule = "NET-001"
framework = "soc2"
control = "CC6.6"
title = "Logical access security measures against threats from outside system boundaries"
verified = false

