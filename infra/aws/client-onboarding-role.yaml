AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Read-only security assessment role. Grants the assessing consultancy temporary,
  read-only access to configuration metadata in this account. It cannot change,
  create or delete anything, and it is explicitly denied from reading stored data
  and secrets. Remove access at any time by deleting this stack.

# -----------------------------------------------------------------------------
# Deployed BY THE CLIENT, in the account being assessed. Nothing else is installed.
# Layer 1 of the read-only boundary (docs/decisions/0002-read-only-security-boundary.md).
# -----------------------------------------------------------------------------

Parameters:
  AssessorPrincipalArn:
    Type: String
    Description: >-
      ARN of the consultancy's platform identity, exactly as given in your setup
      instructions. Only this identity can use the role.
    AllowedPattern: '^arn:aws:iam::\d{12}:(root|user/[\w+=,.@/-]+|role/[\w+=,.@/-]+)$'
    ConstraintDescription: Must be an IAM user, role or account root ARN.

  ExternalId:
    Type: String
    NoEcho: true
    Description: >-
      The ExternalId from your setup instructions. It is unique to your organization
      and prevents anyone else from using this role through the consultancy.
    MinLength: 2
    MaxLength: 1224
    AllowedPattern: '^[\w+=,.@:/-]+$'

  RoleName:
    Type: String
    Default: SubtleTechSecurityAssessment
    Description: Name of the role. Keep the default unless instructed otherwise.
    AllowedPattern: '^[\w+=,.@-]{1,64}$'

  PermissionSet:
    Type: String
    Default: LeastPrivilege
    AllowedValues:
      - LeastPrivilege
      - AwsManagedReadOnly
    Description: >-
      LeastPrivilege (recommended) grants only the read permissions the security
      checks use. AwsManagedReadOnly attaches the broader AWS-managed SecurityAudit
      and ViewOnlyAccess policies instead. Data and secret reads are denied either way.

Conditions:
  UseAwsManaged: !Equals [!Ref PermissionSet, AwsManagedReadOnly]

Resources:
  AssessmentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Read-only security assessment access (no data, no changes).
      # Temporary credentials issued for this role last at most one hour.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: OnlyTheAssessorWithTheCorrectExternalId
            Effect: Allow
            Principal:
              AWS: !Ref AssessorPrincipalArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      # Optional: the broader AWS-managed read-only policies.
      ManagedPolicyArns: !If
        - UseAwsManaged
        - - !Sub arn:${AWS::Partition}:iam::aws:policy/SecurityAudit
          - !Sub arn:${AWS::Partition}:iam::aws:policy/job-function/ViewOnlyAccess
        - !Ref AWS::NoValue
      Policies:
        # Default: exactly the read permissions the checks use, and nothing else.
        - !If
          - UseAwsManaged
          - !Ref AWS::NoValue
          - PolicyName: AssessmentReadOnly
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ExactlyWhatTheChecksRead
                  Effect: Allow
                  Action:
                    # BEGIN GENERATED by `python -m app.policies` (do not edit by hand)
                    - cloudtrail:DescribeTrails
                    - cloudtrail:GetTrailStatus
                    - ec2:DescribeRegions
                    - ec2:DescribeSecurityGroups
                    - iam:GenerateCredentialReport
                    - iam:GetAccountPasswordPolicy
                    - iam:GetAccountSummary
                    - iam:GetCredentialReport
                    - iam:ListEntitiesForPolicy
                    - rds:DescribeDBInstances
                    - s3:GetAccountPublicAccessBlock
                    - s3:GetBucketAcl
                    - s3:GetBucketLocation
                    - s3:GetBucketPolicyStatus
                    - s3:GetBucketPublicAccessBlock
                    - s3:ListAllMyBuckets
                    # END GENERATED
                  Resource: "*"
        # An explicit Deny always wins over any Allow, including permissions added
        # to this role later. The assessment needs configuration, never contents.
        - PolicyName: DenyReadingDataAndSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DenyDataAndSecretReads
                Effect: Deny
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - secretsmanager:GetSecretValue
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:GetParameterHistory
                  - kms:Decrypt
                  - lambda:GetFunction
                  - ec2:GetPasswordData
                  - ec2:GetConsoleOutput
                  - ec2:GetConsoleScreenshot
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                  - logs:StartQuery
                  - athena:GetQueryResults
                  - sqs:ReceiveMessage
                  - kinesis:GetRecords
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - codecommit:GetFile
                  - codecommit:GetBlob
                Resource: "*"
      Tags:
        - Key: Purpose
          Value: Read-only security assessment

Outputs:
  RoleArn:
    Description: Send this value back to the consultancy (it is not a secret).
    Value: !GetAtt AssessmentRole.Arn
