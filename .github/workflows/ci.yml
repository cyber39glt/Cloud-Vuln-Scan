# Continuous Integration: runs on every push and pull request.
# It uses the same Docker setup as local development, so "passes on my machine"
# and "passes in CI" mean the same thing.
name: CI

on:
  push:
  pull_request:

# Least privilege for the workflow token: read the code, nothing else.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the example
        # curl talks to the API over plain http://127.0.0.1, so the smoke test needs
        # cookies without the Secure flag (production refuses this setting).
        run: |
          cp .env.example .env
          sed -i "s/^SESSION_COOKIE_SECURE=.*/SESSION_COOKIE_SECURE=false/" .env
          sed -i "s/^APP_SECRET_KEY=.*/APP_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')/" .env

      - name: Build images and start PostgreSQL + API + worker
        run: docker compose up --build --detach --wait db api worker

      - name: Apply database migrations to a fresh database
        run: docker compose run --rm api alembic upgrade head

      - name: Database models match the migrations (no forgotten migration)
        run: docker compose run --rm api alembic check

      - name: Ruff lint
        run: docker compose run --rm --no-deps api ruff check --output-format=github .

      - name: Ruff format check
        run: docker compose run --rm --no-deps api ruff format --check .

      - name: Tests (including database integration)
        run: docker compose run --rm api pytest

      - name: Smoke test the running API
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready

      - name: Smoke test login -> API -> queue -> worker
        run: bash scripts/ci-smoke.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down --volumes

  production-image:
    name: Build production image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the prod target (includes the dashboard)
        run: >
          docker build --target prod --build-context frontend=./frontend
          --tag cloud-vuln-scan-api:ci ./backend
      - name: Production image must run as a non-root user
        run: test "$(docker run --rm --entrypoint id cloud-vuln-scan-api:ci -un)" = "app"
      - name: Production image contains the built dashboard
        run: docker run --rm --entrypoint test cloud-vuln-scan-api:ci -f /app/web/index.html

  dashboard:
    name: Dashboard (type-check, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Type-check, test and build in the same Node image as development
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE/frontend:/web" -w /web node:24-alpine
          sh -c "npm ci --no-audit --no-fund && npm run typecheck && npm test && npm run build"

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: a secret deleted later is still leaked
      - name: Gitleaks
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo"
          zricethezav/gitleaks:v8.30.1
          git /repo --redact --no-banner --verbose
